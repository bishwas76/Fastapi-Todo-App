services:

  db:
    restart: always
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    env_file:
      - ./.env.docker
    container_name: fastapi_todo_db
    volumes:
      - pgdata:/var/lib/postgresql/:rw
    ports:
      - "${DOCKER_DB_PORT:-5434}:5432"
    networks:
      - fastapi_todo_network

  web:
    image: web:fastapi_todo_web
    container_name: fastapi_todo_web
    restart: always
    env_file:
      - ./.env.docker
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: bash -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
        - "${DOCKER_WEB_PORT:-8000}:8000"
    volumes:
      - uv_env:/app/.venv
      - ./:/app/
    depends_on:
      - db
    networks:
      - fastapi_todo_network
volumes:
  pgdata:
  uv_env:

networks:
 fastapi_todo_network: